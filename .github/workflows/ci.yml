name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore
      - run: dotnet fantomas --check src test ui parity

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Check the package carries its sources for Fable
        run: |
          contents=$(unzip -l artifacts/Flip7.*.nupkg)
          grep -qE ' fable/+Flip7.fsproj$' <<< "$contents"
          if grep -qE ' fable/+(obj|bin)/' <<< "$contents"; then exit 1; fi

  # The parity program prints what the library does, and compiled by Fable and
  # run on the runner's own Node it must print exactly what it prints on .NET
  fable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet tool restore
      - run: dotnet fable parity/Parity.fsproj --outDir ${{ runner.temp }}/parity
      - name: Run it on Node
        run: |
          echo '{ "type": "module" }' > ${{ runner.temp }}/parity/package.json
          node ${{ runner.temp }}/parity/Parity.js > ${{ runner.temp }}/javascript.txt
      - run: dotnet run --project parity/Parity.fsproj -c Release > ${{ runner.temp }}/dotnet.txt
      - name: Compare what JavaScript printed with what .NET printed
        run: |
          if ! diff -q ${{ runner.temp }}/dotnet.txt ${{ runner.temp }}/javascript.txt > /dev/null; then
            diff -u ${{ runner.temp }}/dotnet.txt ${{ runner.temp }}/javascript.txt | cut -c1-400 | head -60
            exit 1
          fi

  # Compiled to Python, it must print the same again, all but the games and
  # decks a seeded Random deals: Fable's Python library seeds System.Random with
  # Python's own generator rather than .NET's, so those differ from the first
  # card until it seeds it as .NET does
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: dotnet tool restore
      - run: dotnet fable parity/Parity.fsproj --lang python --outDir ${{ runner.temp }}/parity
      - name: Install the Python library of the same Fable release
        run: pip install "fable-library==$(jq -r '.tools.fable.version' dotnet-tools.json)"
      - name: Run it on Python
        run: python ${{ runner.temp }}/parity/parity.py > ${{ runner.temp }}/python.txt
      - run: dotnet run --project parity/Parity.fsproj -c Release > ${{ runner.temp }}/dotnet.txt
      - name: Compare what Python printed with what .NET printed
        run: |
          cd ${{ runner.temp }}
          grep -vE '^(game|deck random) ' dotnet.txt > dotnet-unseeded.txt
          grep -vE '^(game|deck random) ' python.txt > python-unseeded.txt
          if ! diff -q dotnet-unseeded.txt python-unseeded.txt > /dev/null; then
            diff -u dotnet-unseeded.txt python-unseeded.txt | cut -c1-400 | head -60
            exit 1
          fi
