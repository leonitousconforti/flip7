name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fantomas --check src test ui

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        rid: [linux-x64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: |
          dotnet publish ui/Flip7.UI.fsproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/${{ matrix.rid }}
      - name: Rename executable
        shell: bash
        run: |
          src="publish/${{ matrix.rid }}/Flip7.UI"
          if [ -f "${src}.exe" ]; then
            mv "${src}.exe" "publish/${{ matrix.rid }}/flip7.exe"
          else
            mv "${src}" "publish/${{ matrix.rid }}/flip7"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flip7-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/flip7
            publish/${{ matrix.rid }}/flip7.exe
