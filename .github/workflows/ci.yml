name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fantomas --check src test ui

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        rid: [linux-x64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          dotnet publish ui/Flip7.UI.fsproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/${{ matrix.rid }}
      - name: Rename executable
        shell: bash
        run: |
          src="publish/${{ matrix.rid }}/Flip7.UI"
          if [ -f "${src}.exe" ]; then
            mv "${src}.exe" "publish/${{ matrix.rid }}/flip7.exe"
          else
            mv "${src}" "publish/${{ matrix.rid }}/flip7"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flip7-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/flip7
            publish/${{ matrix.rid }}/flip7.exe
