name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fantomas --check src test ui parity

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Check the package carries its sources for Fable
        run: |
          contents=$(unzip -l artifacts/Flip7.*.nupkg)
          grep -qE ' fable/+Flip7.fsproj$' <<< "$contents"
          if grep -qE ' fable/+(obj|bin)/' <<< "$contents"; then exit 1; fi

  # The parity program prints what the library does, and compiled by Fable and
  # run on the runner's own Node it must print exactly what it prints on .NET
  fable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fable parity/Parity.fsproj --outDir ${{ runner.temp }}/parity
      - name: Run it on Node
        run: |
          echo '{ "type": "module" }' > ${{ runner.temp }}/parity/package.json
          node ${{ runner.temp }}/parity/Parity.js > ${{ runner.temp }}/javascript.txt
      - run: dotnet run --project parity/Parity.fsproj -c Release > ${{ runner.temp }}/dotnet.txt
      - name: Compare what JavaScript printed with what .NET printed
        run: |
          if ! diff -q ${{ runner.temp }}/dotnet.txt ${{ runner.temp }}/javascript.txt > /dev/null; then
            diff ${{ runner.temp }}/dotnet.txt ${{ runner.temp }}/javascript.txt | cut -c1-400 | head -40
            exit 1
          fi
