name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fantomas --check src test ui

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Check the package carries its sources for Fable
        run: |
          contents=$(unzip -l artifacts/Flip7.*.nupkg)
          grep -qE ' fable/+Flip7.fsproj$' <<< "$contents"
          if grep -qE ' fable/+(obj|bin)/' <<< "$contents"; then exit 1; fi

  fable:
    runs-on: ubuntu-latest
    # The version the library is packed as and the tests compile against
    env:
      Flip7Package: 0.0.0-fable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet fable src/Flip7.fsproj --outDir ${{ runner.temp }}/fable
      - run: dotnet pack src/Flip7.fsproj -c Release -o ${{ runner.temp }}/feed -p:Version=${{ env.Flip7Package }}
      # The tests compile against the packed library, as a Fable project that
      # depends on it would, and run on the runner's own Node
      - name: Compile the tests to JavaScript
        env:
          RestoreAdditionalProjectSources: ${{ runner.temp }}/feed
        run: |
          dotnet fsi test/FableEntry.fsx
          dotnet fable test/Flip7.Test.fsproj --outDir ${{ runner.temp }}/fable-test
          echo '{ "type": "module" }' > ${{ runner.temp }}/fable-test/package.json
      - name: Run the tests on Node
        run: node ${{ runner.temp }}/fable-test/FableEntry.g.js
