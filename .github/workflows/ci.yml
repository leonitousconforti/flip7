name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        rid: [linux-x64, osx-x64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'
      - run: |
          dotnet publish ui/flip7.ui.fsproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish/${{ matrix.rid }}
      - name: Rename executable
        shell: bash
        run: |
          src="publish/${{ matrix.rid }}/flip7.ui"
          if [ -f "${src}.exe" ]; then
            mv "${src}.exe" "publish/${{ matrix.rid }}/flip7.exe"
          else
            mv "${src}" "publish/${{ matrix.rid }}/flip7"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flip7-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/flip7
            publish/${{ matrix.rid }}/flip7.exe
