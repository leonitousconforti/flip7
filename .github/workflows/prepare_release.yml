name: Prepare release

on:
  push:
    branches: [main]

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Look for change files
        id: changes
        run: |
          if find .changeset -name '*.md' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No change files in .changeset, nothing to prepare."
          fi

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.changes.outputs.found == 'true'

      - name: Open or update the release pull request
        if: steps.changes.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope prepare-release --verbose
